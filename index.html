:root{--bg:#FAF8F5;--card:#EFECE6;--ink:#2C2724;--acc:#B5694B;--olive:#7A8450;--mut:#8A8078}

.tab{padding:.5rem .9rem;border-radius:.75rem;font-weight:600;color:var(--mut)}
.tab.on{background:var(--acc);color:#fff}
.bar{height:.6rem;background:#fff;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--olive);transition:width .6s}
.ar-title{font-family:'Amiri',serif}

  return `<div class="card p-4"><div class="flex justify-between gap-2 mb-2"><div class="flex gap-1 flex-wrap"><span class="chip">${PIL[x.cat]?.[I]||''}</span><span class="chip">${t(x.tf)}</span></div><span class="chip !text-white" style="background:${ST[x.status]}">${t(x.status)}</span></div>
